[project]
name = "analise-velas"
version = "1.0.0"
description = "Plataforma de análise de vendas de velas — TCC (CST Banco de Dados)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "xlrd>=2.0.2",
]

[project.scripts]
analise-velas = "analise_velas.main:rodar"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analise_velas"]

